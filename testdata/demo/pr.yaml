openapi: 3.0.3
info: {title: Demo API, version: 1.0.0}
paths:
  /users:
    get:
      summary: List users
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/User"}
  /users/{id}:
    get:
      summary: Get one user
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
  /orders:
    post:
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewOrder"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
components:
  schemas:
    User:
      type: object
      required: [id, name]
      properties:
        id: {type: integer}
        name: {type: string}
    NewOrder:
      type: object
      required: [product, quantity, currency]
      properties:
        product: {type: string}
        quantity: {type: integer}
        currency: {type: string}
    Order:
      type: object
      required: [id]
      properties:
        id: {type: integer}
        product: {type: string}
