openapi: 3.0.3
info: {title: T, version: 1.0.0}
paths:
  /users:
    get:
      responses:
        "200": {description: OK}
  /orders:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product]
              properties:
                product: {type: string}
                quantity: {type: integer}
      responses:
        "201": {description: Created}
